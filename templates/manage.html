<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Call Me Old Fashioned - Manage Profile & Regulars</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px 16px; }
        h1 { color: #333; font-size: 1.4rem; }
        h2 { color: #333; font-size: 1.1rem; margin: 0 0 12px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.95rem; }
        input {
            width: 100%; padding: 10px 8px; margin-top: 4px;
            border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; font-family: Arial, sans-serif;
        }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; font-family: Arial, sans-serif; }
        .btn-dark { background: #333; color: white; margin-top: 12px; }
        .btn-delete { background: #c0392b; color: white; padding: 5px 12px; font-size: 0.85rem; margin: 0; }
        .section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 24px; }
        .regular-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .regular-item:last-of-type { border-bottom: none; }
        a { color: #333; }
        .empty { color: #aaa; font-style: italic; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>⚙️ Manage Profile & Regulars</h1>
    <a href="/">← Back</a>

    <div class="section">
        <h2>Your Profile</h2>
        <form method="POST">
            <input type="hidden" name="action" value="save_profile">
            <label>Your Name</label>
            <input type="text" name="profile_name" value="{{ profile.name }}" placeholder="e.g. Chris">
            <button type="submit" class="btn btn-dark">Save</button>
        </form>
    </div>

    <div class="section">
        <h2>Regulars</h2>
        {% for r in regulars %}
        <div class="regular-item">
            <span>{{ r }}</span>
            <form method="POST" onsubmit="return confirm('Remove {{ r }}?')">
                <input type="hidden" name="action" value="delete_regular">
                <input type="hidden" name="delete_name" value="{{ r }}">
                <button class="btn btn-delete" type="submit">Remove</button>
            </form>
        </div>
        {% else %}
        <p class="empty">No regulars yet.</p>
        {% endfor %}

        <form method="POST" style="margin-top: 16px;">
            <input type="hidden" name="action" value="add_regular">
            <label>Add a Regular</label>
            <input type="text" name="regular_name" placeholder="e.g. Sarah">
            <button type="submit" class="btn btn-dark">Add</button>
        </form>
    </div>
</body>
</html>
