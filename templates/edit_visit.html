<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Call Me Old Fashioned - Edit Visit</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px 16px; }
        h1 { color: #333; font-size: 1.4rem; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 0.95rem; }
        input, select, textarea {
            width: 100%; padding: 10px 8px; margin-top: 4px;
            border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; font-family: Arial, sans-serif;
        }
        .cocktail-row { border: 1px solid #eee; border-radius: 8px; padding: 14px; margin-top: 12px; position: relative; }
        .remove-cocktail {
            position: absolute; top: 10px; right: 10px;
            background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; padding: 0;
        }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; font-family: Arial, sans-serif; }
        .btn-dark { background: #333; color: white; }
        .btn-gray { background: #666; color: white; }
        .btn-outline { background: white; color: #333; border: 1px solid #aaa; }
        a { color: #333; }
        .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <h1>Edit Visit</h1>
    <a href="/">← Back</a>

    <form method="POST">
        <label>Bar / Restaurant</label>
        <input type="text" name="bar_name" required list="bar-suggestions" autocomplete="off" value="{{ visit.bar_name }}">
        <datalist id="bar-suggestions">
            {% for b in bar_names %}
            <option value="{{ b }}">
            {% endfor %}
        </datalist>

        <label>Location</label>
        <input type="text" name="location" value="{{ visit.location }}">

        <label>Date</label>
        <input type="date" name="date" value="{{ visit.date }}" required>

        <h3>Cocktails</h3>
        <div id="cocktails">
            {% for c in visit.cocktails %}
            <div class="cocktail-row">
                <button type="button" class="remove-cocktail" onclick="removeCocktail(this)" title="Remove"{% if loop.first %} style="display:none"{% endif %}>&times;</button>

                <label>Who ordered this?</label>
                <select name="person">
                    {% for p in people %}
                    <option value="{{ p }}"{% if p == c.person %} selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                    {% if c.person and c.person not in people %}
                    <option value="{{ c.person }}" selected>{{ c.person }}</option>
                    {% endif %}
                </select>

                <label>Cocktail Name</label>
                <input type="text" name="cocktail_name" value="{{ c.name }}">

                <label>Overall Rating (1–5)</label>
                <select name="rating">
                    {% for n in [1,2,3,4,5] %}
                    <option{% if c.rating == n|string %} selected{% endif %}>{{ n }}</option>
                    {% endfor %}
                </select>

                <label>Ice Quality</label>
                <select name="ice_quality">
                    {% for opt in ["Big clear cube", "Standard cube", "Crushed", "No ice", "Other"] %}
                    <option{% if c.ice_quality == opt %} selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>

                <label>Taste / Balance (1–5)</label>
                <select name="taste_balance">
                    {% for n in [1,2,3,4,5] %}
                    <option{% if c.taste_balance == n|string %} selected{% endif %}>{{ n }}</option>
                    {% endfor %}
                </select>

                <label>Notes</label>
                <textarea name="notes" rows="2">{{ c.notes }}</textarea>
            </div>
            {% endfor %}
        </div>

        <div class="actions">
            <button type="button" class="btn btn-gray" onclick="addCocktail()">+ Add Another Cocktail</button>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-dark">Save Changes</button>
            <a href="/" class="btn btn-outline">Cancel</a>
        </div>
    </form>

    <script>
        const peopleOptions = `{% for p in people %}<option value="{{ p }}">{{ p }}</option>{% endfor %}`;

        function buildRow() {
            const rows = document.querySelectorAll(".cocktail-row");
            const clone = rows[0].cloneNode(true);
            clone.querySelectorAll("input, textarea").forEach(el => el.value = "");
            clone.querySelector("select[name='person']").innerHTML = peopleOptions;
            clone.querySelector("select[name='rating']").value = "5";
            clone.querySelector("select[name='taste_balance']").value = "5";
            clone.querySelector("select[name='ice_quality']").value = "Big clear cube";
            clone.querySelector(".remove-cocktail").style.display = "block";
            return clone;
        }

        function addCocktail() {
            document.getElementById("cocktails").appendChild(buildRow());
        }

        function removeCocktail(btn) {
            if (document.querySelectorAll(".cocktail-row").length > 1) {
                btn.closest(".cocktail-row").remove();
            }
        }
    </script>
</body>
</html>
